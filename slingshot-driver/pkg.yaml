name: slingshot-driver-pkg
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
  - stage: kernel-build
  - image: "{{ .LLVM_IMAGE }}:{{ .TOOLS_REV }}"
steps:
  - sources:
      - url: {{ if .slingshot_cassini_headers_ref }}https://github.com/HewlettPackard/shs-cassini-headers/archive/{{ .slingshot_cassini_headers_ref }}.tar.gz{{ else }}https://github.com/HewlettPackard/shs-cassini-headers/archive/refs/tags/release/shs-{{ .slingshot_version }}.tar.gz{{ end }}
        destination: cassini-headers.tar.gz
        sha256: "{{ .slingshot_cassini_headers_sha256 }}"
        sha512: "{{ .slingshot_cassini_headers_sha512 }}"
      - url: {{ if .slingshot_base_link_ref }}https://github.com/HewlettPackard/ss-sbl/archive/{{ .slingshot_base_link_ref }}.tar.gz{{ else }}https://github.com/HewlettPackard/ss-sbl/archive/refs/tags/release/shs-{{ .slingshot_version }}.tar.gz{{ end }}
        destination: slingshot_base_link.tar.gz
        sha256: "{{ .slingshot_base_link_sha256 }}"
        sha512: "{{ .slingshot_base_link_sha512 }}"
      - url: https://github.com/HewlettPackard/ss-link/archive/refs/tags/release/shs-{{ .slingshot_version }}.tar.gz
        destination: sl-driver.tar.gz
        sha256: "{{ .slingshot_sl_driver_sha256 }}"
        sha512: "{{ .slingshot_sl_driver_sha512 }}"
      - url: {{ if .slingshot_firmware_cassini_ref }}https://github.com/HewlettPackard/shs-firmware-cassini2-devel/archive/{{ .slingshot_firmware_cassini_ref }}.tar.gz{{ else }}https://github.com/HewlettPackard/shs-firmware-cassini2-devel/archive/refs/tags/release/shs-{{ .slingshot_version }}.tar.gz{{ end }}
        destination: firmware_cassini.tar.gz
        sha256: "{{ .slingshot_firmware_cassini_sha256 }}"
        sha512: "{{ .slingshot_firmware_cassini_sha512 }}"
      - url: https://github.com/HewlettPackard/shs-cxi-driver/archive/refs/tags/release/shs-{{ .slingshot_version }}.tar.gz
        destination: cxi-driver.tar.gz
        sha256: "{{ .slingshot_cxi_driver_sha256 }}"
        sha512: "{{ .slingshot_cxi_driver_sha512 }}"
      - url: https://github.com/HewlettPackard/shs-kfabric/archive/refs/tags/release/shs-{{ .slingshot_version }}.tar.gz
        destination: kfabric.tar.gz
        sha256: "{{ .slingshot_kfabric_sha256 }}"
        sha512: "{{ .slingshot_kfabric_sha512 }}"

  - env:
      ARCH: {{ if eq .ARCH "aarch64"}}arm64{{ else if eq .ARCH "x86_64" }}x86_64{{ else }}unsupported{{ end }}
      LLVM: 1
    prepare:
      - |
        for f in *.tar.gz ; do
            dirname="${f//.*}"
            mkdir -p "${dirname}"
            tar -xf "${f}" --strip-components=1 -C "${dirname}"
        done

        # add symlink to ensure all other packages find the headers
        ln -sf . cassini-headers/install

        # disable installing git hooks since we are not working on a git checkout
        sed -i -e 's|: setup|:|' slingshot_base_link/Makefile

        # apply slingshot_base_link patches
        cd slingshot_base_link
        patch -p1 < /pkg/patches/0003-slingshot_base_link-fix-clang-fallthrough.patch
        patch -p1 < /pkg/patches/0100-sbl-kernel-timer-update.patch
        cd ..

        # apply sl-driver patches
        cd sl-driver
        patch -p1 < /pkg/patches/0101-sl-kernel-timer-update.patch
        cd ..

        # apply cxi-driver patches
        cd cxi-driver
        patch -p1 < /pkg/patches/0102-cxi-kernel-update.patch
        cd ..

        # apply kfabric patches
        cd kfabric
        patch -p1 < /pkg/patches/0103-kfabric-kernel-update.patch
        patch -p1 < /pkg/patches/0104-kfabric-fix-parallel-build.patch
        cd ..

        # properly prepare sl
        cp sl-driver/common/configs/config.mak.cassini sl-driver/config.mak
    build:
      - |
        make -j $(nproc) -C slingshot_base_link KDIR=/src SBL_EXTERNAL_BUILD=1 PLATFORM_CASSINI_HW=1 STAGING_DIR="${PWD}/slingshot_base_link/staging_dir" NO_BUILD_TESTS=1 stage_install
        make -j $(nproc) -C sl-driver KDIR=/src STAGING_DIR="${PWD}/sl-driver/staging_dir" NO_BUILD_TESTS=1 stage_install ARCH="${ARCH}"
        make -j $(nproc) -C cxi-driver KDIR=/src NO_BUILD_TESTS=1 SUBDIRS="drivers/net/ethernet/hpe/ss1"
        make -j $(nproc) -C kfabric KDIR=/src NO_BUILD_TESTS=1

    install:
      - |
        mkdir -p /rootfs/usr/lib/modules/$(cat /src/include/config/kernel.release)/

        cp /src/modules.order /rootfs/usr/lib/modules/$(cat /src/include/config/kernel.release)/
        cp /src/modules.builtin /rootfs/usr/lib/modules/$(cat /src/include/config/kernel.release)/
        cp /src/modules.builtin.modinfo /rootfs/usr/lib/modules/$(cat /src/include/config/kernel.release)/

        make -C /src M="${PWD}/slingshot_base_link" modules_install DESTDIR="/rootfs" INSTALL_MOD_PATH=/rootfs/usr INSTALL_MOD_DIR=extras INSTALL_MOD_STRIP=1 CONFIG_MODULE_SIG_ALL=Y
        make -C /src M="${PWD}/sl-driver/drivers/net/ethernet/hpe/sl" modules_install DESTDIR="/rootfs" INSTALL_MOD_PATH=/rootfs/usr INSTALL_MOD_DIR=extras INSTALL_MOD_STRIP=1 CONFIG_MODULE_SIG_ALL=Y
        make -C /src M="${PWD}/cxi-driver/drivers/net/ethernet/hpe/ss1" modules_install DESTDIR="/rootfs" INSTALL_MOD_PATH=/rootfs/usr INSTALL_MOD_DIR=extras INSTALL_MOD_STRIP=1 CONFIG_MODULE_SIG_ALL=Y
        make -C /src M="${PWD}/kfabric" modules_install DESTDIR="/rootfs" INSTALL_MOD_PATH=/rootfs/usr INSTALL_MOD_DIR=extras INSTALL_MOD_STRIP=1 CONFIG_MODULE_SIG_ALL=Y

        find /rootfs

    test:
      - |
        find /rootfs/usr/lib/modules -name '*.ko' -exec grep -FL '~Module signature appended~' {} \+
      - |
        fhs-validator /rootfs

finalize:
  - from: /rootfs
    to: /
